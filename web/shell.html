<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fortress Crawl</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; overscroll-behavior: none; }
  #canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; outline: none; cursor: crosshair;
            touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #d8c49a; text-align: center;
    background: rgba(5, 4, 8, 0.72); pointer-events: none; padding: 16px;
  }
  #overlay h1 { margin: 0; font-size: 28px; letter-spacing: 6px; color: #f0c870; }
  #overlay .keys { color: #9c8f78; max-width: 640px; }
  #overlay .go { color: #fff2c8; font-size: 16px; }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay">
  <h1>FORTRESS CRAWL</h1>
  <div id="status">Loading...</div>
  <div class="keys" id="keys">WASD move &middot; mouse look &middot; left/right click attack &middot; 1-3 weapons &middot; Q spell, R next<br>
    H/J potions &middot; TAB/I/B menu &middot; M map &middot; F1 debug &middot; Esc releases the mouse<br>
    Gamepads: press START to join (split screen, up to 4 players)</div>
  <div class="go" id="go"></div>
</div>
<script>
  var overlay = document.getElementById('overlay');
  var statusEl = document.getElementById('status');
  var goEl = document.getElementById('go');
  var canvas = document.getElementById('canvas');
  var ready = false;
  // Phones and tablets: on-screen controls instead of pointer lock, a smaller view distance
  var touch = window.matchMedia('(pointer: coarse)').matches || /[?&]touch\b/.test(location.search);
  var started = false;
  if (touch) {
    document.getElementById('keys').innerHTML =
      'Left thumb: move (push far to sprint) &middot; right thumb: look<br>' +
      'Buttons: attack, alternate attack, jump, crouch, weapon &middot; SKILL and MAP at the top<br>' +
      'Play in landscape. Gamepads work too: press START.';
  }
  // the overlay only covers loading: the game has its own start screen
  function updateOverlay() {
    overlay.classList.toggle('hidden', ready);
  }
  if (touch) {
    window.addEventListener('touchend', function () {
      if (!ready || started) return;
      started = true;
      // fullscreen and landscape where the browser allows it (not on iPhones)
      var el = document.documentElement;
      var fs = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fs) {
        try {
          var p = fs.call(el, { navigationUI: 'hide' });
          if (p && p.then) p.then(function () {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
          }).catch(function () {});
        } catch (e) {}
      }
    }, { capture: true });
  }
  var Module = {
    canvas: canvas,
    // extra command line options from the address, e.g. ?args=--debug+--seed+42
    arguments: (touch ? ['--touch', '--radius', '2'] : []).concat(
      new URLSearchParams(location.search).get('seed') ? ['--seed', new URLSearchParams(location.search).get('seed')] : [],
      (new URLSearchParams(location.search).get('args') || '').split(/[ +]/).filter(Boolean)),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    setStatus: function (t) { if (t) statusEl.textContent = t; },
    onRuntimeInitialized: function () { ready = true; updateOverlay(); canvas.focus(); }
  };
  window.addEventListener('error', function () { statusEl.textContent = 'Something went wrong - see the browser console.'; });
  // keep the browser from scrolling or switching focus on game keys
  window.addEventListener('keydown', function (e) {
    if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8'].indexOf(e.code) >= 0) e.preventDefault();
  }, { passive: false });
</script>
{{{ SCRIPT }}}
</body>
</html>
